name: CI

# Runs the same hermetic gate contributors run locally as
# `docker build --target test .`, so a regression is caught on the pull request
# instead of surfacing at release time. No secrets and no registry writes: this
# workflow only ever builds.
on:
  pull_request:
    branches: [main]
  # Also on main, so a merge is verified and — more importantly — so the
  # BuildKit layer cache is written on the default branch, which is the only
  # scope every pull request can read from.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request pushes are pointless to finish; main is not, since
  # each commit there refreshes the cache the pull requests read.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Hermetic gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `cargo fmt --check`, `cargo clippy --all-targets --locked -D warnings`
      # and `cargo test --locked` all run inside this build — the `test` stage
      # chains them with `&&`, so a failure here fails the step. `--locked`
      # additionally proves Cargo.lock is in sync with Cargo.toml.
      - name: Run the hermetic gate (fmt + clippy + tests)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          # Keep the built stage in the local daemon so the timezone re-run
          # below can reuse its already-compiled test binaries.
          load: true
          tags: calendar-ics-mcp:ci-test
          platforms: linux/amd64
          cache-from: type=gha,scope=test
          # Only main writes the cache. A pull request's cache is visible to
          # that pull request alone, so writing it here would buy nothing while
          # evicting the shared main-branch entry under the repository cache
          # limit.
          # (Written as `!= && value || ''` on purpose: in the `A && B || C`
          # idiom an empty B is falsy and would fall through to C, so the
          # non-empty branch has to be B.)
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=test' || '' }}

      # The suite must pass under any host timezone (clippy.toml bans
      # chrono::Local, this proves it empirically). Re-running the test
      # binaries the gate already compiled costs about a second — nothing is
      # rebuilt.
      - name: Prove host-TZ independence
        run: |
          docker run --rm -e TZ=Pacific/Kiritimati calendar-ics-mcp:ci-test \
            cargo test --locked --offline

  # The gate builds debug only. The artifact that actually ships is a static
  # musl binary built with LTO, opt-level="z" and panic="abort" — a
  # combination the gate never exercises, so without this job a breakage there
  # stays invisible until a release is published.
  release-build:
    name: Release build (musl static)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Both platforms, matching release.yml. No QEMU: the builder stage is
      # pinned to $BUILDPLATFORM and cargo-zigbuild cross-compiles natively.
      - name: Build the release image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=release
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=release' || '' }}
